<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/LOGO.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>POOLUX Studio</title>
    <link rel="preload" href="/fonts/MiSansVF.woff2" as="font" type="font/woff2" crossorigin />
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Loading 屏幕 - React 加载完成后会被替换 -->
      <div id="loading-screen" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #f8f9fb;
        font-family: 'MiSans', sans-serif;
        z-index: 9999;
      ">
        <div style="
          width: 48px;
          height: 48px;
          border: 3px solid rgba(115, 139, 229, 0.2);
          border-top-color: #738BE5;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        "></div>
        <p style="
          margin-top: 16px;
          color: #616161;
          font-size: 14px;
        ">加载中...</p>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // React 加载完成后移除 loading 屏幕
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loading = document.getElementById('loading-screen');
          if (loading) {
            loading.style.opacity = '0';
            loading.style.transition = 'opacity 0.3s ease';
            setTimeout(() => loading.remove(), 300);
          }
        }, 100);
      });
    </script>
  </body>
</html>
